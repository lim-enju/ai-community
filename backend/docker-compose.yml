services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_community
    ports:
      - '5432:5432'
    volumes:
      - ai-community-postgres-data:/var/lib/postgresql/data

volumes:
  ai-community-postgres-data:
